<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>デモトレード</title>
  <!-- ライブ株価表示(WSS)はWorker(/api/live-prices)がYahoo Financeへパススルー中継するため、
       クライアントは自ドメインへの接続のみで済む(仕様書4.8) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; frame-src https://challenges.cloudflare.com;" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Turnstile: サイトキーはapp.js側で __TURNSTILE_SITE_KEY__ をCloudflareダッシュボードで発行した値に置き換える -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div id="app"><div class="empty-hint">読み込み中...</div></div>
  <script src="/app.js"></script>
</body>
</html>
